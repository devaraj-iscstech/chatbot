<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Chatbot API Test Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            text-align: center;
        }

        .header h1 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }

        input[type="text"],
        input[type="file"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .checkbox-group {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: normal;
        }

        .response {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            border-left: 4px solid #667eea;
            max-height: 400px;
            overflow-y: auto;
        }

        .response h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .response pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
        }

        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }

        .status.connected {
            background: #d4edda;
            color: #155724;
        }

        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 4px solid #dc3545;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 4px solid #28a745;
        }

        .source-item {
            background: #fff;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            border-left: 3px solid #667eea;
        }

        .source-item strong {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🤖 RAG Chatbot API Test Interface</h1>
            <p>Test your Google AI (Gemini) powered RAG Chatbot</p>
            <div>
                <span>Status:</span>
                <span id="connectionStatus" class="status disconnected">Checking...</span>
            </div>
        </div>

        <!-- Main Grid -->
        <div class="grid">
            <!-- Query Card -->
            <div class="card">
                <h2>💬 Ask a Question</h2>
                <form id="queryForm">
                    <div class="form-group">
                        <label for="question">Question:</label>
                        <textarea id="question" placeholder="What is TheUdyog?" required></textarea>
                    </div>

                    <div class="checkbox-group">
                        <label>
                            <input type="checkbox" id="useMemory"> Use Memory
                        </label>
                        <label>
                            <input type="checkbox" id="returnSources" checked> Return Sources
                        </label>
                    </div>

                    <button type="submit" id="queryBtn">Ask Question</button>
                </form>

                <div id="queryResponse"></div>
            </div>

            <!-- Upload Card -->
            <div class="card">
                <h2>📁 Upload Document</h2>
                <form id="uploadForm">
                    <div class="form-group">
                        <label for="fileUpload">Select File (PDF, TXT, CSV, HTML, MD):</label>
                        <input type="file" id="fileUpload" accept=".pdf,.txt,.csv,.html,.md" required>
                    </div>

                    <button type="submit" id="uploadBtn">Upload & Ingest</button>
                </form>

                <div id="uploadResponse"></div>
            </div>

            <!-- Ingest Path Card -->
            <div class="card">
                <h2>📄 Ingest from Path</h2>
                <form id="ingestForm">
                    <div class="form-group">
                        <label for="filePath">File Path:</label>
                        <input type="text" id="filePath" placeholder="./TheUdyog Brochure.pdf" required>
                    </div>

                    <button type="submit" id="ingestBtn">Ingest Document</button>
                </form>

                <div id="ingestResponse"></div>
            </div>

            <!-- Stats Card -->
            <div class="card">
                <h2>📊 System Stats</h2>
                <button onclick="getStats()" id="statsBtn">Get Statistics</button>
                <div id="statsResponse"></div>
            </div>
        </div>

        <!-- Documents List -->
        <div class="card">
            <h2>📚 Indexed Documents</h2>
            <button onclick="listDocuments()" id="docsBtn">List Documents</button>
            <div id="docsResponse"></div>
        </div>

        <!-- Configuration -->
        <div class="card">
            <h2>⚙️ Configuration</h2>
            <button onclick="getConfig()" id="configBtn">Show Config</button>
            <div id="configResponse"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';

        // Check connection on load
        window.onload = () => {
            checkConnection();
        };

        // Check API connection
        async function checkConnection() {
            const statusEl = document.getElementById('connectionStatus');
            try {
                const response = await fetch(`${API_URL}/health`);
                if (response.ok) {
                    statusEl.textContent = 'Connected';
                    statusEl.className = 'status connected';
                } else {
                    statusEl.textContent = 'Disconnected';
                    statusEl.className = 'status disconnected';
                }
            } catch (error) {
                statusEl.textContent = 'Disconnected';
                statusEl.className = 'status disconnected';
            }
        }

        // Query Form
        document.getElementById('queryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('queryBtn');
            const responseDiv = document.getElementById('queryResponse');

            btn.disabled = true;
            btn.innerHTML = 'Processing... <span class="loading"></span>';

            const question = document.getElementById('question').value;
            const useMemory = document.getElementById('useMemory').checked;
            const returnSources = document.getElementById('returnSources').checked;

            try {
                const response = await fetch(`${API_URL}/query`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        question: question,
                        use_memory: useMemory,
                        return_sources: returnSources
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    let html = '<div class="response"><h3>Answer:</h3><pre>' + data.answer + '</pre>';

                    if (data.sources && data.sources.length > 0) {
                        html += '<h3 style="margin-top: 20px;">Sources:</h3>';
                        data.sources.forEach((source, i) => {
                            html += `<div class="source-item">
                                <strong>Source ${i + 1} (Score: ${source.score.toFixed(3)})</strong><br>
                                ${source.text.substring(0, 200)}...
                            </div>`;
                        });
                    }

                    html += '</div>';
                    responseDiv.innerHTML = html;
                } else {
                    responseDiv.innerHTML = `<div class="error">Error: ${data.detail}</div>`;
                }
            } catch (error) {
                responseDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Ask Question';
            }
        });

        // Upload Form
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('uploadBtn');
            const responseDiv = document.getElementById('uploadResponse');

            btn.disabled = true;
            btn.innerHTML = 'Uploading... <span class="loading"></span>';

            const fileInput = document.getElementById('fileUpload');
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                const response = await fetch(`${API_URL}/ingest/upload`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    responseDiv.innerHTML = `<div class="success">
                        ✅ Successfully ingested ${data.filename}<br>
                        📦 Created ${data.chunks_created} chunks
                    </div>`;
                    fileInput.value = '';
                } else {
                    responseDiv.innerHTML = `<div class="error">Error: ${data.detail}</div>`;
                }
            } catch (error) {
                responseDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Upload & Ingest';
            }
        });

        // Ingest Path Form
        document.getElementById('ingestForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('ingestBtn');
            const responseDiv = document.getElementById('ingestResponse');

            btn.disabled = true;
            btn.innerHTML = 'Ingesting... <span class="loading"></span>';

            const filePath = document.getElementById('filePath').value;

            try {
                const response = await fetch(`${API_URL}/ingest/path`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ file_path: filePath })
                });

                const data = await response.json();

                if (response.ok) {
                    responseDiv.innerHTML = `<div class="success">
                        ✅ Successfully ingested ${data.filename}<br>
                        📦 Created ${data.chunks_created} chunks
                    </div>`;
                    document.getElementById('filePath').value = '';
                } else {
                    responseDiv.innerHTML = `<div class="error">Error: ${data.detail}</div>`;
                }
            } catch (error) {
                responseDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Ingest Document';
            }
        });

        // Get Stats
        async function getStats() {
            const btn = document.getElementById('statsBtn');
            const responseDiv = document.getElementById('statsResponse');

            btn.disabled = true;
            btn.innerHTML = 'Loading... <span class="loading"></span>';

            try {
                const response = await fetch(`${API_URL}/stats`);
                const data = await response.json();

                if (response.ok) {
                    responseDiv.innerHTML = `<div class="response">
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>`;
                } else {
                    responseDiv.innerHTML = `<div class="error">Error: ${data.detail}</div>`;
                }
            } catch (error) {
                responseDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Get Statistics';
            }
        }

        // List Documents
        async function listDocuments() {
            const btn = document.getElementById('docsBtn');
            const responseDiv = document.getElementById('docsResponse');

            btn.disabled = true;
            btn.innerHTML = 'Loading... <span class="loading"></span>';

            try {
                const response = await fetch(`${API_URL}/documents`);
                const data = await response.json();

                if (response.ok) {
                    if (data.documents && data.documents.length > 0) {
                        let html = '<div class="response">';
                        data.documents.forEach(doc => {
                            html += `<div class="source-item">
                                📄 <strong>${doc.filename}</strong><br>
                                Chunks: ${doc.chunk_count}
                            </div>`;
                        });
                        html += '</div>';
                        responseDiv.innerHTML = html;
                    } else {
                        responseDiv.innerHTML = '<div class="response">No documents indexed yet.</div>';
                    }
                } else {
                    responseDiv.innerHTML = `<div class="error">Error: ${data.detail}</div>`;
                }
            } catch (error) {
                responseDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'List Documents';
            }
        }

        // Get Config
        async function getConfig() {
            const btn = document.getElementById('configBtn');
            const responseDiv = document.getElementById('configResponse');

            btn.disabled = true;
            btn.innerHTML = 'Loading... <span class="loading"></span>';

            try {
                const response = await fetch(`${API_URL}/config`);
                const data = await response.json();

                if (response.ok) {
                    responseDiv.innerHTML = `<div class="response">
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>`;
                } else {
                    responseDiv.innerHTML = `<div class="error">Error: ${data.detail}</div>`;
                }
            } catch (error) {
                responseDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Show Config';
            }
        }
    </script>
</body>
</html>
